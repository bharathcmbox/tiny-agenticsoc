[project]
name = "socagent"
version = "0.1.0"
description = "tiny-agenticsoc agentic plane: alert poller, triage and investigation agents"
requires-python = ">=3.12"
dependencies = ["openai>=1.60", "anthropic>=1.0", "mcp>=2.3", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
