<!-- Wazuh centralized config for group "sensor" (sensor-gw): network telemetry -->
<agent_config>
  <!-- Suricata: alerts + protocol metadata, community_id enabled -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>

  <!-- Zeek JSON logs (zeekctl rotates hourly; 'current' always points at live files) -->
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/conn.log</location><label key="zeek.log">conn</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/dns.log</location><label key="zeek.log">dns</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/http.log</location><label key="zeek.log">http</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/ssl.log</location><label key="zeek.log">ssl</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/files.log</location><label key="zeek.log">files</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/notice.log</location><label key="zeek.log">notice</label></localfile>
  <localfile><log_format>json</log_format><location>/opt/zeek/logs/current/weird.log</location><label key="zeek.log">weird</label></localfile>

  <!-- gateway DNS server log (dnsmasq log-queries -> syslog/journal) -->
  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
    <filter field="_SYSTEMD_UNIT">^dnsmasq.service$</filter>
  </localfile>
</agent_config>
