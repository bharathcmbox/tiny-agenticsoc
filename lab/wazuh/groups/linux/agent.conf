<!-- Wazuh centralized config for group "linux" (lin-victim): host telemetry -->
<agent_config>
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- tighter FIM on persistence locations commonly touched by atomics -->
  <syscheck>
    <frequency>3600</frequency>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/cron.d,/etc/crontab,/var/spool/cron,/etc/systemd/system,/etc/profile.d</directories>
    <directories realtime="yes" check_all="yes">/root/.ssh,/home</directories>
  </syscheck>
</agent_config>
